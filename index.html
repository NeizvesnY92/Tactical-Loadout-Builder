<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#18211c"><title>Tactical Loadout Builder</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121914;color:#e9f0e8;font:15px system-ui,-apple-system,sans-serif}header{padding:17px;background:#233128;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}small{color:#aebdad}main{max-width:850px;margin:auto;padding:15px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,select{background:#344b3a;border:1px solid #67806c;color:white;border-radius:9px;padding:10px 12px;font-size:14px}button:active{background:#53765a}.workspace{background:radial-gradient(circle,#344338,#1b2820);border:1px solid #526a55;border-radius:18px;min-height:460px;display:grid;place-items:center;overflow:hidden;touch-action:none;position:relative}.vest{width:260px;height:350px;background:#69785a;border:8px solid #4d5d46;border-radius:48px 48px 60px 60px;position:relative;box-shadow:inset 0 0 0 2px #87957a,0 18px 45px #0006}.vest:before,.vest:after{content:"";position:absolute;top:-26px;width:65px;height:75px;border:15px solid #526348;border-radius:20px;z-index:-1}.vest:before{left:14px}.vest:after{right:14px}.molle{position:absolute;inset:45px 16px 40px;background:repeating-linear-gradient(to bottom,transparent 0 20px,#43513b 20px 27px,transparent 27px 34px);opacity:.8;border-radius:12px}.patch{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#26342b;padding:5px 12px;border-radius:5px;font-size:11px;white-space:nowrap}.item{position:absolute;min-width:48px;min-height:50px;background:#26372b;border:2px solid #9bab83;border-radius:7px;display:grid;place-items:center;text-align:center;font-size:11px;padding:5px;touch-action:none;user-select:none;cursor:grab;box-shadow:0 3px 8px #0005}.item.selected{outline:3px solid #f5d77d}.hint{color:#b8c8b8;line-height:1.5}.panel{background:#1f2b22;padding:13px;border-radius:12px;margin-top:12px}label{display:block;margin-bottom:8px}footer{padding:18px;text-align:center;color:#9bab9b;font-size:12px}
</style></head><body><header><div><h1>TACTICAL LOADOUT BUILDER</h1><small>Альфа · мобильный редактор</small></div><span>v0.1</span></header><main>
<div class="controls"><button id="front">Перед</button><button id="back">Спина</button><select id="color"><option value="#69785a">Олива</option><option value="#a0906b">Койот</option><option value="#353b38">Чёрный</option></select></div>
<div class="workspace" id="workspace"><div class="vest" id="vest"><div class="molle"></div><div class="patch" id="patch">FRONT</div></div></div>
<div class="panel"><label>Добавить снаряжение</label><div class="controls"><button data-add="Магазин">+ Магазин</button><button data-add="Аптечка">+ Аптечка</button><button data-add="Радио">+ Радио</button><button data-add="Утилити">+ Утилити</button><button data-add="Граната">+ Граната</button></div><div class="controls"><button id="rotate">Повернуть выбранное</button><button id="remove">Удалить выбранное</button><button id="save">Сохранить</button><button id="reset">Очистить сторону</button></div></div>
<p class="hint">Перетаскивай подсумки пальцем по жилету. Нажми на подсумок, чтобы выбрать его. Сборки сохраняются в браузере отдельно для передней и задней сторон.</p></main><footer>Прототип для планирования экипировки. Не является точной моделью MOLLE.</footer>
<script>
const vest=document.getElementById('vest'),patch=document.getElementById('patch');let side='front',selected=null,drag=null;
const state={front:[],back:[]};try{Object.assign(state,JSON.parse(localStorage.getItem('tlb-v1')||'{}'))}catch(e){}
function persist(){localStorage.setItem('tlb-v1',JSON.stringify(state))}
function draw(){vest.querySelectorAll('.item').forEach(e=>e.remove());patch.textContent=side.toUpperCase();selected=null;(state[side]||[]).forEach((o,i)=>{let el=document.createElement('div');el.className='item';el.textContent=o.name;el.style.left=o.x+'px';el.style.top=o.y+'px';el.style.transform='rotate('+(o.r||0)+'deg)';el.dataset.index=i;vest.append(el);el.addEventListener('pointerdown',e=>{e.preventDefault();selected=i;drag={id:e.pointerId,px:e.clientX,py:e.clientY,x:o.x,y:o.y};el.setPointerCapture(e.pointerId);vest.querySelectorAll('.item').forEach(n=>n.classList.remove('selected'));el.classList.add('selected')});el.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let maxX=vest.clientWidth-el.offsetWidth,maxY=vest.clientHeight-el.offsetHeight;o.x=Math.max(0,Math.min(maxX,drag.x+e.clientX-drag.px));o.y=Math.max(0,Math.min(maxY,drag.y+e.clientY-drag.py));el.style.left=o.x+'px';el.style.top=o.y+'px'});el.addEventListener('pointerup',()=>{drag=null;persist()});el.addEventListener('pointercancel',()=>{drag=null;persist()})})}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{state[side].push({name:b.dataset.add,x:95,y:130,r:0});persist();draw();selected=state[side].length-1;vest.querySelectorAll('.item')[selected]?.classList.add('selected')});
document.getElementById('front').onclick=()=>{side='front';draw()};document.getElementById('back').onclick=()=>{side='back';draw()};
document.getElementById('color').onchange=e=>vest.style.background=e.target.value;
document.getElementById('rotate').onclick=()=>{if(selected===null)return;state[side][selected].r=(state[side][selected].r+90)%360;persist();draw()};
document.getElementById('remove').onclick=()=>{if(selected===null)return;state[side].splice(selected,1);persist();draw()};
document.getElementById('reset').onclick=()=>{if(confirm('Очистить эту сторону?')){state[side]=[];persist();draw()}};
document.getElementById('save').onclick=()=>{persist();alert('Сборка сохранена на этом устройстве')};draw();
</script></body></html>
